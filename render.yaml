# Render Blueprint for the GTMX admin console. The API, app and waitlist
# deploy from the gtmx repo's render.yaml; its docs/deploy-render.md has the
# full setup.
services:
  - type: web
    name: gtmx-admin
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: bun install --frozen-lockfile && bun run build --filter=web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # An internal console: never framed, never indexed.
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
    envVars:
      - key: BUN_VERSION
        value: 1.3.14
      # The gtmx-api URL, e.g. https://gtmx-api.onrender.com. This site's own
      # URL must be in the API's ALLOWED_ORIGINS. Baked in at build time.
      - key: VITE_API_ORIGIN
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
